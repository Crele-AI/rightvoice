[project]
name = "rightvoice"
version = "1.0.0"
description = "A benchmark for keeping one voice from a conversation, given a short sample of that voice. Made by Crele."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Crele" }]
urls = { Homepage = "https://www.crele.co/benchmarks/rightvoice", Repository = "https://github.com/Crele-AI/rightvoice" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12",
  "soxr>=0.5",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
build = ["pyroomacoustics>=0.8"]
score = [
  "openai-whisper==20250625",
  "jiwer>=3.0",
  "torch>=2.4",
  "torchaudio>=2.4",
  "silero-vad>=5.1",
  "speechbrain>=1.0",
  "onnxruntime>=1.18",
  "librosa>=0.10",
]

[project.scripts]
rightvoice = "rightvoice.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rightvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
